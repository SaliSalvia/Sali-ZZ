name: Build SaliBussiness APK

on:
  workflow_dispatch:
  push:
    branches: [ main, 'arena/**', 'copilot/**', 'fix/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: build-sali-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9 (with caching)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # تا وقتی wrapper واقعی در ریپو commit نشده، از توزیع پین‌شده 8.9 تولید می‌کنیم.
      # گام بعدی (فاز ۲): commit کردن gradlew + gradle-wrapper.jar + gradle-wrapper.properties
      - name: Generate Gradle wrapper (pinned 8.9)
        run: gradle wrapper --gradle-version 8.9 --distribution-type bin

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew --no-daemon test

      # تا پاک‌سازی baseline، lint بلاک‌کننده نیست ولی گزارشش در artifact diagnostics هست.
      - name: Android lint (non-blocking until baseline is clean)
        continue-on-error: true
        run: ./gradlew --no-daemon lintDebug

      - name: Build debug APK (always installable)
        run: ./gradlew --no-daemon assembleDebug

      - name: Collect debug APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/SaliBussiness-debug.apk

      # APK امضاشده فقط وقتی ساخته می‌شود که «هر چهار» سیکرت تنظیم شده باشد.
      # APK دیباگ هرگز به‌عنوان نسخه انتشار عرضه نمی‌شود.
      - name: Build SIGNED release APK (only when all 4 signing secrets exist)
        env:
          SALI_KEYSTORE_BASE64: ${{ secrets.SALI_KEYSTORE_BASE64 }}
          SALI_KEYSTORE_PASSWORD: ${{ secrets.SALI_KEYSTORE_PASSWORD }}
          SALI_KEY_ALIAS: ${{ secrets.SALI_KEY_ALIAS }}
          SALI_KEY_PASSWORD: ${{ secrets.SALI_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SALI_KEYSTORE_BASE64" || -z "$SALI_KEYSTORE_PASSWORD" || -z "$SALI_KEY_ALIAS" || -z "$SALI_KEY_PASSWORD" ]]; then
            echo "Signing secrets incomplete -> only the clearly-labelled DEBUG apk is produced in this run."
            exit 0
          fi
          printf '%s' "$SALI_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sali.keystore"
          ./gradlew --no-daemon assembleRelease \
            -Pandroid.injected.signing.storeFile="$RUNNER_TEMP/sali.keystore" \
            -Pandroid.injected.signing.storePassword="$SALI_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.keyAlias="$SALI_KEY_ALIAS" \
            -Pandroid.injected.signing.keyPassword="$SALI_KEY_PASSWORD"
          cp app/build/outputs/apk/release/app-release.apk dist/SaliBussiness-release.apk

      - name: Checksums
        run: cd dist && sha256sum *.apk > SHA256SUMS.txt

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: SaliBussiness-APK-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 60

      - name: Create GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: SaliBussiness ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            app/build/reports/
            app/build/outputs/
          if-no-files-found: ignore
          retention-days: 14
