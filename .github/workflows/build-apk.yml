name: Build Sali-ZZai APK

on:
  workflow_dispatch:
  push:
    # Default branch of this repo is `master` (a merge into it previously
    # triggered no build at all because only `main` was listed here).
    branches: [ main, master, security-hardening, 'arena/**', 'copilot/**', 'fix/**' ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

concurrency:
  group: build-sali-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish signed release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: Sali-ZZai-APK-${{ github.sha }}
          path: dist/

      - name: Require a signed release APK
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s dist/Sali-ZZai-release.apk ]]; then
            echo "::error::No signed release APK exists. Configure all four SALI signing secrets before publishing."
            exit 1
          fi

      - name: Resolve release tag
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            version=$(sed -n 's/^[[:space:]]*versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -n1)
            [[ -n "$version" ]] || { echo "::error::Could not read versionName"; exit 1; }
            tag="v$version"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || steps.version.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Sali-ZZai ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/Sali-ZZai-release.apk
            dist/SHA256SUMS.txt

  build:
    name: Test and build APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_built: ${{ steps.release.outputs.release_built }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9 (with caching)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # The pinned Gradle 8.9 wrapper (gradlew + wrapper jar + properties) is
      # committed in the repo, so there is no need to regenerate it; doing so
      # re-downloaded the distribution and intermittently failed the whole
      # build before compilation even started.
      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Run unit tests
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon test --console=plain > /tmp/test.log 2>&1
          code=$?
          # Surface the actual compiler/test errors as check annotations
          grep -E "^e: |error:|FAILED|Execution failed" /tmp/test.log | head -n 30 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done
          tail -n 50 /tmp/test.log >> "$GITHUB_STEP_SUMMARY"
          exit $code

      # تا پاک‌سازی baseline، lint بلاک‌کننده نیست ولی گزارشش در artifact diagnostics هست.
      - name: Android lint (non-blocking until baseline is clean)
        continue-on-error: true
        run: ./gradlew --no-daemon lintDebug

      - name: Build debug APK (always installable)
        run: ./gradlew --no-daemon assembleDebug

      - name: Collect debug APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Sali-ZZai-debug.apk

      # Public releases must use the repository's production signing key.
      - name: Build release APK (requires production signing secrets)
        id: release
        env:
          SALI_KEYSTORE_BASE64: ${{ secrets.SALI_KEYSTORE_BASE64 }}
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SALI_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SALI_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SALI_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$SALI_KEYSTORE_BASE64" && -n "$SIGNING_KEYSTORE_PASSWORD" && -n "$SIGNING_KEY_ALIAS" && -n "$SIGNING_KEY_PASSWORD" ]]; then
            printf '%s' "$SALI_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sali.keystore"
            echo "SIGNING_KEYSTORE_FILE=$RUNNER_TEMP/sali.keystore" >> "$GITHUB_ENV"
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk dist/Sali-ZZai-release.apk
            echo "release_built=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Release APK skipped: configure all four SALI signing secrets before publishing."
            echo "release_built=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checksums
        run: cd dist && sha256sum *.apk > SHA256SUMS.txt

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Sali-ZZai-APK-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 60

      - name: Upload build diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics
          path: |
            app/build/reports/
            app/build/outputs/
          if-no-files-found: ignore
          retention-days: 14
