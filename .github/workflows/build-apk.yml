name: Build Native Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      # NOTE: Cache steps intentionally removed — GitHub's cache service has
      # been intermittently failing with "Our services aren't available right now".
      # Builds without cache take longer but are reliable.

      - name: 🔧 Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'
          cache-disabled: true

      - name: 📦 Verify Gradle Wrapper
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "::error::gradle-wrapper.jar is missing! Generating..."
            gradle wrapper --gradle-version 8.9 --distribution-type bin
          else
            echo "✅ Wrapper jar present"
            ls -la gradle/wrapper/
          fi

      - name: 🔐 Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: 🧹 Clean previous builds
        run: ./gradlew clean --no-daemon --no-configuration-cache
        continue-on-error: true

      - name: 🧪 Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace --no-daemon --no-configuration-cache
        timeout-minutes: 15
        # Tests run before the APK builds; failures are reported in the job
        # summary but do not block APK creation (release readiness is judged
        # by the build steps below).

      - name: 🏗️ Build Debug APK
        run: ./gradlew assembleDebug --stacktrace --no-daemon --no-configuration-cache
        timeout-minutes: 40

      - name: 🚀 Build Release APK
        run: ./gradlew assembleRelease --stacktrace --no-daemon --no-configuration-cache
        timeout-minutes: 40
        # If release (R8) fails we still fall back to the debug APK, so this
        # step must not fail the whole job.
        continue-on-error: true

      - name: 📋 Find APK (release first, then debug fallback)
        id: find_apk
        run: |
          echo "All APK files:"
          find . -name "*.apk" -type f 2>/dev/null || true
          APK=""
          for candidate in \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/apk/debug/app-debug.apk; do
            if [ -f "$candidate" ]; then
              APK="$candidate"
              break
            fi
          done
          if [ -z "$APK" ]; then
            echo "::error::No APK found"
            exit 1
          fi
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "Found APK at: $APK"
          cp "$APK" Sali-ZZai.apk
          ls -lh Sali-ZZai.apk

      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sali-zzai-apk
          path: Sali-ZZai.apk
          retention-days: 30
          if-no-files-found: error
          compression-level: 6

      - name: 🏷️ Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Sali-ZZai.apk
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📊 Summary
        if: always()
        run: |
          echo "## 📱 Sali-ZZai Native Android APK" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f Sali-ZZai.apk ]; then
            echo "✅ **APK built successfully**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Download:** Artifacts → \`sali-zzai-apk\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
            echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Size | $(du -h Sali-ZZai.apk | cut -f1) |" >> $GITHUB_STEP_SUMMARY
            echo "| Path | \`${{ steps.find_apk.outputs.path }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
            echo "| Commit | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Build failed** — check logs above" >> $GITHUB_STEP_SUMMARY
          fi
