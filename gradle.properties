# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
# Disable configuration-cache for compatibility with KSP / Room
# org.gradle.configuration-cache=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
# Use KSP 1 (legacy) for compatibility with Room 2.6.x.
# Upgrade Room to 2.7.x and re-enable KSP 2 if needed.
ksp.useKSP2=false
